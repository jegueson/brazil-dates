name: Post Deploy Smoke

on:
  deployment_status:

jobs:
  smoke-production:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != null && contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate production URL is reachable
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          curl --fail --silent --show-error \
            ${VERCEL_AUTOMATION_BYPASS_SECRET:+--header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"} \
            "${{ github.event.deployment_status.environment_url }}"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e
